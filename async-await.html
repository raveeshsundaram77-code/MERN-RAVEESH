<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CAMEL CASE
        function getStudent(){
            return new Promise(function(resolve){
                console.log("Promise is pending...");
                
                setTimeout(function(){
                    resolve("Arun");

                },3000);

            });
        }
        //Async is keyword
        async function displayStudent(){
        console.log(" loaded student..");
        let student = await getStudent();
        console.log(student);
    }
    displayStudent();
    </script>

    
</body>
</html>
